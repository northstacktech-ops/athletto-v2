name: Deploy homolog
on:
  push:
    branches: [homolog]
  workflow_dispatch:

# Dois pushes seguidos disparariam dois `vercel deploy --prod` ao mesmo tempo,
# e o que terminasse por último venceria, mesmo sendo o commit mais antigo.
concurrency:
  group: deploy-homolog
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g vercel
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
